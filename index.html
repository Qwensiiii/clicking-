<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎰 Казино Кликер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0f0f1a;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, sans-serif;
            color: white;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Шапка */
        .header {
            background: #1a1a2e;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 2px solid #ffd700;
        }

        .balance {
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
        }

        .balance-label {
            font-size: 12px;
            color: #a8a8b3;
        }

        /* Экраны */
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .hidden {
            display: none !important;
        }

        /* Кликер */
        .chip {
            font-size: 130px;
            cursor: pointer;
            transition: transform 0.1s;
            animation: glow 2s infinite;
        }

        .chip:active {
            transform: scale(0.85);
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.6)); }
            50% { filter: drop-shadow(0 0 50px rgba(255, 215, 0, 0.9)); }
        }

        .tap-hint {
            margin-top: 20px;
            color: #a8a8b3;
            font-size: 14px;
        }

        /* Навигация */
        .nav {
            display: flex;
            background: #1a1a2e;
            border-top: 2px solid #333;
        }

        .nav button {
            flex: 1;
            background: none;
            border: none;
            color: white;
            padding: 15px 5px;
            font-size: 22px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .nav button.active {
            background: #2a2a4a;
            border-top: 2px solid #ffd700;
        }

        /* Слоты */
        .slot-machine {
            background: #2a2a4a;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
        }

        .slots-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .slot {
            width: 80px;
            height: 80px;
            background: #1a1a2e;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border: 3px solid #444;
        }

        .btn {
            background: #ffd700;
            color: #1a1a2e;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:disabled {
            background: #666;
            color: #999;
        }

        /* Рулетка */
        .roulette-wheel {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(
                red 0deg 45deg,
                black 45deg 90deg,
                red 90deg 135deg,
                black 135deg 180deg,
                red 180deg 225deg,
                black 225deg 270deg,
                red 270deg 315deg,
                black 315deg 360deg
            );
            margin: 20px auto;
            position: relative;
            border: 5px solid #ffd700;
            transition: transform 3s ease-out;
        }

        .roulette-ball {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 15px;
            background: white;
            border-radius: 50%;
            border: 2px solid #333;
        }

        .bet-buttons {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .bet-btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .bet-red { background: #ff4444; color: white; }
        .bet-black { background: #333; color: white; }
        .bet-green { background: #00aa00; color: white; }

        /* Кости */
        .dice {
            font-size: 80px;
            margin: 20px;
        }

        .result-message {
            font-size: 20px;
            margin: 15px;
            min-height: 30px;
            text-align: center;
        }

        .win { color: #00ff00; }
        .lose { color: #ff4444; }

        /* Адаптация */
        @media (max-width: 400px) {
            .slot { width: 60px; height: 60px; font-size: 30px; }
            .chip { font-size: 100px; }
        }
    </style>
</head>
<body>
    <!-- Шапка -->
    <div class="header">
        <div class="balance-label">ВАШ БАЛАНС</div>
        <div class="balance" id="balance">1000</div>
    </div>

    <!-- Экран Кликера -->
    <div class="screen" id="clicker-screen">
        <div class="chip" id="chip">🪙</div>
        <div class="tap-hint">Тапай, чтобы заработать фишки!</div>
    </div>

    <!-- Экран Слотов -->
    <div class="screen hidden" id="slots-screen">
        <div class="slot-machine">
            <h2 style="text-align:center; margin-bottom:10px;">🎰 Слоты</h2>
            <div class="slots-row">
                <div class="slot" id="slot1">🎰</div>
                <div class="slot" id="slot2">🎰</div>
                <div class="slot" id="slot3">🎰</div>
            </div>
            <div class="result-message" id="slot-result"></div>
            <button class="btn" id="spin-btn" onclick="spin()">
                Крутить (100)
            </button>
        </div>
    </div>

    <!-- Экран Рулетки -->
    <div class="screen hidden" id="roulette-screen">
        <h2 style="margin-bottom:10px;">🎡 Рулетка</h2>
        <div class="roulette-wheel" id="wheel">
            <div class="roulette-ball"></div>
        </div>
        <div class="result-message" id="roulette-result"></div>
        <div class="bet-buttons">
            <button class="bet-btn bet-red" onclick="betRoulette('red')">Красное</button>
            <button class="bet-btn bet-black" onclick="betRoulette('black')">Чёрное</button>
            <button class="bet-btn bet-green" onclick="betRoulette('green')">Zero</button>
        </div>
        <div style="font-size:14px; color:#a8a8b3;">Ставка: 100 фишек</div>
    </div>

    <!-- Экран Костей -->
    <div class="screen hidden" id="dice-screen">
        <h2 style="margin-bottom:10px;">🎲 Кости</h2>
        <div class="dice" id="dice-result">🎲</div>
        <div class="result-message" id="dice-message">Угадай число от 1 до 6</div>
        <div class="bet-buttons">
            <button class="bet-btn" style="background:#333;color:white;" onclick="betDice('low')">1-3</button>
            <button class="bet-btn" style="background:#ffd700;color:#333;" onclick="betDice('high')">4-6</button>
        </div>
        <div style="font-size:14px; color:#a8a8b3;">Ставка: 100 фишек</div>
    </div>

    <!-- Навигация -->
    <div class="nav">
        <button class="active" id="nav-clicker" onclick="showScreen('clicker')">🪙</button>
        <button id="nav-slots" onclick="showScreen('slots')">🎰</button>
        <button id="nav-roulette" onclick="showScreen('roulette')">🎡</button>
        <button id="nav-dice" onclick="showScreen('dice')">🎲</button>
    </div>

    <script>
        // ============ СОСТОЯНИЕ ============
        let balance = 1000;
        let isSpinning = false;

        // ============ БАЛАНС ============
        function updateBalance() {
            document.getElementById('balance').textContent = balance;
        }

        function addCoins(amount) {
            balance += amount;
            updateBalance();
        }

        function spendCoins(amount) {
            if (balance >= amount) {
                balance -= amount;
                updateBalance();
                return true;
            }
            return false;
        }

        // ============ НАВИГАЦИЯ ============
        function showScreen(screen) {
            // Скрыть все экраны
            document.getElementById('clicker-screen').classList.add('hidden');
            document.getElementById('slots-screen').classList.add('hidden');
            document.getElementById('roulette-screen').classList.add('hidden');
            document.getElementById('dice-screen').classList.add('hidden');

            // Убрать active со всех кнопок
            document.querySelectorAll('.nav button').forEach(btn => {
                btn.classList.remove('active');
            });

            // Показать нужный
            document.getElementById(screen + '-screen').classList.remove('hidden');
            document.getElementById('nav-' + screen).classList.add('active');
        }

        // ============ КЛИКЕР ============
        document.getElementById('chip').addEventListener('click', () => {
            addCoins(1);
            
            // Анимация
            const chip = document.getElementById('chip');
            chip.style.transform = 'scale(0.9)';
            setTimeout(() => {
                chip.style.transform = 'scale(1)';
            }, 100);
        });

        // ============ СЛОТЫ ============
        const slotEmojis = ['🍒', '🍋', '💎', '7️⃣', '⭐', '🔔'];

        function spin() {
            if (isSpinning) return;
            if (!spendCoins(100)) {
                showSlotResult('Недостаточно фишек!', 'lose');
                return;
            }

            isSpinning = true;
            const spinBtn = document.getElementById('spin-btn');
            spinBtn.disabled = true;
            spinBtn.textContent = 'Крутим...';

            document.getElementById('slot-result').textContent = '';
            document.getElementById('slot-result').className = 'result-message';

            // Анимация вращения
            const slots = [1, 2, 3].map(i => document.getElementById('slot' + i));
            
            let spinInterval = setInterval(() => {
                slots.forEach(slot => {
                    slot.textContent = slotEmojis[Math.floor(Math.random() * slotEmojis.length)];
                });
            }, 100);

            // Остановка
            setTimeout(() => {
                clearInterval(spinInterval);

                // Финальные значения
                const result = slots.map(slot => {
                    const emoji = slotEmojis[Math.floor(Math.random() * slotEmojis.length)];
                    slot.textContent = emoji;
                    return emoji;
                });

                // Проверка выигрыша
                if (result[0] === result[1] && result[1] === result[2]) {
                    // Джекпот!
                    const winAmount = 500;
                    addCoins(winAmount);
                    showSlotResult('🎉 ДЖЕКПОТ! +' + winAmount + ' фишек!', 'win');
                } else if (result[0] === result[1] || result[1] === result[2] || result[0] === result[2]) {
                    const winAmount = 150;
                    addCoins(winAmount);
                    showSlotResult('✨ Две одинаковые! +' + winAmount + ' фишек', 'win');
                } else {
                    showSlotResult('😢 Попробуй ещё раз', 'lose');
                }

                isSpinning = false;
                spinBtn.disabled = false;
                spinBtn.textContent = 'Крутить (100)';
            }, 2000);
        }

        function showSlotResult(message, type) {
            const resultEl = document.getElementById('slot-result');
            resultEl.textContent = message;
            resultEl.className = 'result-message ' + type;
        }

        // ============ РУЛЕТКА ============
        function betRoulette(color) {
            if (!spendCoins(100)) {
                showRouletteResult('Недостаточно фишек!', 'lose');
                return;
            }

            const wheel = document.getElementById('wheel');
            const numbers = ['green', 'red', 'black', 'red', 'black', 'red', 'black', 'red', 'black'];
            
            // Случайный результат
            const result = numbers[Math.floor(Math.random() * numbers.length)];
            
            // Поворот колеса
            const rotation = 720 + Math.floor(Math.random() * 360);
            wheel.style.transform = 'rotate(' + rotation + 'deg)';

            setTimeout(() => {
                if (result === color) {
                    let winAmount;
                    if (color === 'green') {
                        winAmount = 1400; // Zero платит 14:1
                    } else {
                        winAmount = 200; // Цвет платит 2:1
                    }
                    addCoins(winAmount);
                    showRouletteResult('🎉 Выпало ' + result + '! +' + winAmount + ' фишек!', 'win');
                } else {
                    showRouletteResult('😢 Выпало ' + result + '. Повезёт в другой раз!', 'lose');
                }
                
                // Вернуть колесо
                setTimeout(() => {
                    wheel.style.transform = 'rotate(0deg)';
                }, 1000);
            }, 3000);
        }

        function showRouletteResult(message, type) {
            const resultEl = document.getElementById('roulette-result');
            resultEl.textContent = message;
            resultEl.className = 'result-message ' + type;
        }

        // ============ КОСТИ ============
        function betDice(choice) {
            if (!spendCoins(100)) {
                showDiceResult('Недостаточно фишек!', 'lose');
                return;
            }

            const dice = document.getElementById('dice-result');
            const diceEmojis = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
            
            // Анимация броска
            let rollInterval = setInterval(() => {
                dice.textContent = diceEmojis[Math.floor(Math.random() * 6)];
            }, 100);

            setTimeout(() => {
                clearInterval(rollInterval);
                
                const result = Math.floor(Math.random() * 6) + 1;
                dice.textContent = diceEmojis[result - 1];
                
                const isLow = result <= 3;
                const isHigh = result > 3;
                
                if ((choice === 'low' && isLow) || (choice === 'high' && isHigh)) {
                    addCoins(200);
                    showDiceResult('🎉 Выпало ' + result + '! +200 фишек!', 'win');
                } else {
                    showDiceResult('😢 Выпало ' + result + '. Не угадал!', 'lose');
                }
            }, 1500);
        }

        function showDiceResult(message, type) {
            const resultEl = document.getElementById('dice-message');
            resultEl.textContent = message;
            resultEl.className = 'result-message ' + type;
        }

        // ============ ИНИЦИАЛИЗАЦИЯ ============
        updateBalance();

        // Поддержка Telegram WebApp
        if (window.Telegram?.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
