<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎰 Казино</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0f0f1a;
            height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: -apple-system, sans-serif;
            color: white;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Шапка */
        .header {
            background: #1a1a2e;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 2px solid #ffd700;
        }

        .balance {
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
        }

        .balance-label {
            font-size: 12px;
            color: #a8a8b3;
        }

        /* Экраны */
        .screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .hidden {
            display: none !important;
        }

        /* Меню */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 350px;
        }

        .menu-item {
            background: #2a2a4a;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            border: 2px solid transparent;
        }

        .menu-item:active {
            transform: scale(0.95);
            background: #3a3a5a;
        }

        .menu-item:hover {
            border-color: #ffd700;
        }

        .menu-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .menu-title {
            font-size: 18px;
            font-weight: bold;
        }

        .menu-desc {
            font-size: 12px;
            color: #a8a8b3;
            margin-top: 5px;
        }

        /* Профиль */
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #2a2a4a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin: 20px auto;
            border: 3px solid #ffd700;
        }

        .profile-name {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }

        .profile-stats {
            width: 100%;
            max-width: 350px;
            margin-top: 20px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: #2a2a4a;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #a8a8b3;
        }

        .stat-value {
            font-weight: bold;
            color: #ffd700;
        }

        /* Слоты */
        .slot-machine {
            background: #2a2a4a;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
        }

        .slots-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .slot {
            width: 80px;
            height: 80px;
            background: #1a1a2e;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            border: 3px solid #444;
        }

        .btn {
            background: #ffd700;
            color: #1a1a2e;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:disabled {
            background: #666;
            color: #999;
        }

        .back-btn {
            background: none;
            border: 2px solid #444;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 14px;
        }

        /* Рулетка */
        .roulette-wheel {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(
                red 0deg 45deg,
                black 45deg 90deg,
                red 90deg 135deg,
                black 135deg 180deg,
                red 180deg 225deg,
                black 225deg 270deg,
                red 270deg 315deg,
                black 315deg 360deg
            );
            margin: 20px auto;
            position: relative;
            border: 5px solid #ffd700;
            transition: transform 3s ease-out;
        }

        .roulette-ball {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 15px;
            background: white;
            border-radius: 50%;
            border: 2px solid #333;
        }

        .bet-buttons {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
            justify-content: center;
        }

        .bet-btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .bet-red { background: #ff4444; color: white; }
        .bet-black { background: #333; color: white; }
        .bet-green { background: #00aa00; color: white; }

        /* Кости */
        .dice {
            font-size: 80px;
            margin: 20px;
        }

        .result-message {
            font-size: 20px;
            margin: 15px;
            min-height: 30px;
            text-align: center;
        }

        .win { color: #00ff00; }
        .lose { color: #ff4444; }

        /* Навигация */
        .nav {
            display: flex;
            background: #1a1a2e;
            border-top: 2px solid #333;
        }

        .nav button {
            flex: 1;
            background: none;
            border: none;
            color: white;
            padding: 15px 5px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .nav button.active {
            background: #2a2a4a;
            border-top: 2px solid #ffd700;
        }

        .nav-icon {
            font-size: 22px;
            display: block;
        }

        /* Адаптация */
        @media (max-width: 400px) {
            .slot { width: 60px; height: 60px; font-size: 30px; }
            .menu-icon { font-size: 40px; }
        }
    </style>
</head>
<body>
    <!-- Шапка -->
    <div class="header">
        <div class="balance-label">ВАШ БАЛАНС</div>
        <div class="balance" id="balance">1000</div>
    </div>

    <!-- Экран Меню -->
    <div class="screen" id="menu-screen">
        <div class="menu-grid">
            <div class="menu-item" onclick="showScreen('slots')">
                <div class="menu-icon">🎰</div>
                <div class="menu-title">Слоты</div>
                <div class="menu-desc">Крути барабаны</div>
            </div>
            <div class="menu-item" onclick="showScreen('roulette')">
                <div class="menu-icon">🎡</div>
                <div class="menu-title">Рулетка</div>
                <div class="menu-desc">Угадай цвет</div>
            </div>
            <div class="menu-item" onclick="showScreen('dice')">
                <div class="menu-icon">🎲</div>
                <div class="menu-title">Кости</div>
                <div class="menu-desc">Больше/меньше</div>
            </div>
            <div class="menu-item" onclick="showScreen('profile')">
                <div class="menu-icon">👤</div>
                <div class="menu-title">Профиль</div>
                <div class="menu-desc">Статистика</div>
            </div>
        </div>
    </div>

    <!-- Экран Слотов -->
    <div class="screen hidden" id="slots-screen">
        <button class="back-btn" onclick="showScreen('menu')">← Назад</button>
        <div class="slot-machine">
            <h2 style="text-align:center; margin-bottom:10px;">🎰 Слоты</h2>
            <div class="slots-row">
                <div class="slot" id="slot1">🎰</div>
                <div class="slot" id="slot2">🎰</div>
                <div class="slot" id="slot3">🎰</div>
            </div>
            <div class="result-message" id="slot-result"></div>
            <button class="btn" id="spin-btn" onclick="spin()">
                Крутить (100)
            </button>
        </div>
    </div>

    <!-- Экран Рулетки -->
    <div class="screen hidden" id="roulette-screen">
        <button class="back-btn" onclick="showScreen('menu')">← Назад</button>
        <h2 style="margin-bottom:10px;">🎡 Рулетка</h2>
        <div class="roulette-wheel" id="wheel">
            <div class="roulette-ball"></div>
        </div>
        <div class="result-message" id="roulette-result"></div>
        <div class="bet-buttons">
            <button class="bet-btn bet-red" onclick="betRoulette('red')">Красное</button>
            <button class="bet-btn bet-black" onclick="betRoulette('black')">Чёрное</button>
            <button class="bet-btn bet-green" onclick="betRoulette('green')">Zero</button>
        </div>
        <div style="font-size:14px; color:#a8a8b3;">Ставка: 100 фишек</div>
    </div>

    <!-- Экран Костей -->
    <div class="screen hidden" id="dice-screen">
        <button class="back-btn" onclick="showScreen('menu')">← Назад</button>
        <h2 style="margin-bottom:10px;">🎲 Кости</h2>
        <div class="dice" id="dice-result">🎲</div>
        <div class="result-message" id="dice-message">Угадай число от 1 до 6</div>
        <div class="bet-buttons">
            <button class="bet-btn" style="background:#333;color:white;" onclick="betDice('low')">1-3</button>
            <button class="bet-btn" style="background:#ffd700;color:#333;" onclick="betDice('high')">4-6</button>
        </div>
        <div style="font-size:14px; color:#a8a8b3;">Ставка: 100 фишек</div>
    </div>

    <!-- Экран Профиля -->
    <div class="screen hidden" id="profile-screen">
        <div class="profile-avatar" id="profile-avatar">👤</div>
        <div class="profile-name" id="profile-name">Гость</div>
        
        <div class="profile-stats">
            <div class="stat-row">
                <span class="stat-label">💰 Баланс</span>
                <span class="stat-value" id="stat-balance">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">🎰 Игр сыграно</span>
                <span class="stat-value" id="stat-games">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">🏆 Выигрышей</span>
                <span class="stat-value" id="stat-wins">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">💸 Проигрышей</span>
                <span class="stat-value" id="stat-losses">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">📅 Дней в игре</span>
                <span class="stat-value" id="stat-days">1</span>
            </div>
        </div>
        
        <button class="btn" style="margin-top:20px; background:#ff4444; color:white;" onclick="resetProfile()">
            Сбросить профиль
        </button>
    </div>

    <!-- Навигация -->
    <div class="nav">
        <button class="active" id="nav-menu" onclick="showScreen('menu')">
            <span class="nav-icon">🏠</span> Меню
        </button>
        <button id="nav-slots" onclick="showScreen('slots')">
            <span class="nav-icon">🎰</span> Слоты
        </button>
        <button id="nav-roulette" onclick="showScreen('roulette')">
            <span class="nav-icon">🎡</span> Рулетка
        </button>
        <button id="nav-dice" onclick="showScreen('dice')">
            <span class="nav-icon">🎲</span> Кости
        </button>
        <button id="nav-profile" onclick="showScreen('profile')">
            <span class="nav-icon">👤</span> Профиль
        </button>
    </div>

    <script>
        // ============ ДАННЫЕ ПОЛЬЗОВАТЕЛЯ ============
        let userData = {
            userId: null,
            username: 'Гость',
            firstName: '',
            balance: 1000,
            gamesPlayed: 0,
            wins: 0,
            losses: 0,
            daysPlayed: 1,
            firstVisit: null,
            lastVisit: null
        };

        // ============ ИНИЦИАЛИЗАЦИЯ TELEGRAM ============
        function initTelegram() {
            if (window.Telegram?.WebApp) {
                const tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                
                const user = tg.initDataUnsafe?.user;
                if (user) {
                    userData.userId = user.id;
                    userData.username = user.username || 'Гость';
                    userData.firstName = user.first_name || '';
                }
            }
            
            loadUserData();
            updateUI();
        }

        // ============ СОХРАНЕНИЕ ДАННЫХ ============
        function getStorageKey() {
            return 'casino_data_' + (userData.userId || 'guest');
        }

        function saveUserData() {
            userData.lastVisit = new Date().toISOString();
            
            // Сохраняем в localStorage (основное хранилище)
            localStorage.setItem(getStorageKey(), JSON.stringify(userData));
            
            // Также сохраняем в Telegram Cloud Storage (если доступно)
            if (window.Telegram?.WebApp?.CloudStorage) {
                window.Telegram.WebApp.CloudStorage.setItem(
                    getStorageKey(),
                    JSON.stringify(userData)
                );
            }
        }

        function loadUserData() {
            // Сначала пробуем localStorage
            const localData = localStorage.getItem(getStorageKey());
            
            if (localData) {
                try {
                    const parsed = JSON.parse(localData);
                    userData = { ...userData, ...parsed };
                    
                    // Проверяем дни
                    checkDays();
                    
                    // Обновляем UI
                    updateUI();
                    return;
                } catch (e) {
                    console.error('Ошибка загрузки из localStorage', e);
                }
            }
            
            // Если нет в localStorage, пробуем Telegram Cloud Storage
            if (window.Telegram?.WebApp?.CloudStorage) {
                window.Telegram.WebApp.CloudStorage.getItem(
                    getStorageKey(),
                    (err, value) => {
                        if (!err && value) {
                            try {
                                const parsed = JSON.parse(value);
                                userData = { ...userData, ...parsed };
                                checkDays();
                                updateUI();
                            } catch (e) {
                                console.error('Ошибка загрузки из CloudStorage', e);
                            }
                        } else {
                            // Первый визит
                            userData.firstVisit = new Date().toISOString();
                            saveUserData();
                        }
                    }
                );
            } else {
                // Первый визит
                userData.firstVisit = new Date().toISOString();
                saveUserData();
            }
        }

        function checkDays() {
            if (userData.firstVisit) {
                const first = new Date(userData.firstVisit);
                const now = new Date();
                const diffDays = Math.floor((now - first) / (1000 * 60 * 60 * 24)) + 1;
                userData.daysPlayed = diffDays;
            }
        }

        // ============ ОБНОВЛЕНИЕ UI ============
        function updateUI() {
            document.getElementById('balance').textContent = userData.balance;
            
            // Профиль
            const avatar = document.getElementById('profile-avatar');
            const name = document.getElementById('profile-name');
            
            if (userData.userId && window.Telegram?.WebApp) {
                avatar.textContent = userData.firstName ? userData.firstName[0].toUpperCase() : '👤';
                name.textContent = userData.firstName || userData.username;
            }
            
            document.getElementById('stat-balance').textContent = userData.balance;
            document.getElementById('stat-games').textContent = userData.gamesPlayed;
            document.getElementById('stat-wins').textContent = userData.wins;
            document.getElementById('stat-losses').textContent = userData.losses;
            document.getElementById('stat-days').textContent = userData.daysPlayed;
        }

        // ============ БАЛАНС ============
        function addCoins(amount) {
            userData.balance += amount;
            saveUserData();
            updateUI();
        }

        function spendCoins(amount) {
            if (userData.balance >= amount) {
                userData.balance -= amount;
                saveUserData();
                updateUI();
                return true;
            }
            return false;
        }

        // ============ НАВИГАЦИЯ ============
        function showScreen(screen) {
            const screens = ['menu', 'slots', 'roulette', 'dice', 'profile'];
            
            screens.forEach(s => {
                document.getElementById(s + '-screen').classList.add('hidden');
            });
            
            document.querySelectorAll('.nav button').forEach(btn => {
                btn.classList.remove('active');
            });
            
            document.getElementById(screen + '-screen').classList.remove('hidden');
            document.getElementById('nav-' + screen).classList.add('active');
            
            if (screen === 'profile') {
                updateUI();
            }
        }

        // ============ СЛОТЫ ============
        const slotEmojis = ['🍒', '🍋', '💎', '7️⃣', '⭐', '🔔'];
        let isSpinning = false;

        function spin() {
            if (isSpinning) return;
            if (!spendCoins(100)) {
                showSlotResult('Недостаточно фишек!', 'lose');
                return;
            }

            isSpinning = true;
            userData.gamesPlayed++;
            
            const spinBtn = document.getElementById('spin-btn');
            spinBtn.disabled = true;
            spinBtn.textContent = 'Крутим...';

            document.getElementById('slot-result').textContent = '';
            document.getElementById('slot-result').className = 'result-message';

            const slots = [1, 2, 3].map(i => document.getElementById('slot' + i));
      let spinInterval = setInterval(() => {
                slots.forEach(slot => {
                    slot.textContent = slotEmojis[Math.floor(Math.random() * slotEmojis.length)];
                });
            }, 100);

            setTimeout(() => {
                clearInterval(spinInterval);

                const result = slots.map(slot => {
                    const emoji = slotEmojis[Math.floor(Math.random() * slotEmojis.length)];
                    slot.textContent = emoji;
                    return emoji;
                });

                if (result[0] === result[1] && result[1] === result[2]) {
                    const winAmount = 500;
                    addCoins(winAmount);
                    userData.wins++;
                    showSlotResult('🎉 ДЖЕКПОТ! +' + winAmount + ' фишек!', 'win');
                } else if (result[0] === result[1] || result[1] === result[2] || result[0] === result[2]) {
                    const winAmount = 150;
                    addCoins(winAmount);
                    userData.wins++;
                    showSlotResult('✨ Две одинаковые! +' + winAmount + ' фишек', 'win');
                } else {
                    userData.losses++;
                    showSlotResult('😢 Попробуй ещё раз', 'lose');
                }

                saveUserData();
                isSpinning = false;
                spinBtn.disabled = false;
                spinBtn.textContent = 'Крутить (100)';
            }, 2000);
        }

        function showSlotResult(message, type) {
            const resultEl = document.getElementById('slot-result');
            resultEl.textContent = message;
            resultEl.className = 'result-message ' + type;
        }

        // ============ РУЛЕТКА ============
        function betRoulette(color) {
            if (!spendCoins(100)) {
                showRouletteResult('Недостаточно фишек!', 'lose');
                return;
            }

            userData.gamesPlayed++;
            const wheel = document.getElementById('wheel');
            const numbers = ['green', 'red', 'black', 'red', 'black', 'red', 'black', 'red', 'black'];
            const result = numbers[Math.floor(Math.random() * numbers.length)];
            const rotation = 720 + Math.floor(Math.random() * 360);
            wheel.style.transform = 'rotate(' + rotation + 'deg)';

            setTimeout(() => {
                if (result === color) {
                    let winAmount;
                    if (color === 'green') {
                        winAmount = 1400;
                    } else {
                        winAmount = 200;
                    }
                    addCoins(winAmount);
                    userData.wins++;
                    showRouletteResult('🎉 Выпало ' + result + '! +' + winAmount + ' фишек!', 'win');
                } else {
                    userData.losses++;
                    showRouletteResult('😢 Выпало ' + result + '. Повезёт в другой раз!', 'lose');
                }
                
                saveUserData();
                
                setTimeout(() => {
                    wheel.style.transform = 'rotate(0deg)';
                }, 1000);
            }, 3000);
        }

        function showRouletteResult(message, type) {
            const resultEl = document.getElementById('roulette-result');
            resultEl.textContent = message;
            resultEl.className = 'result-message ' + type;
        }

        // ============ КОСТИ ============
        function betDice(choice) {
            if (!spendCoins(100)) {
                showDiceResult('Недостаточно фишек!', 'lose');
                return;
            }

            userData.gamesPlayed++;
            const dice = document.getElementById('dice-result');
            const diceEmojis = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
            
            let rollInterval = setInterval(() => {
                dice.textContent = diceEmojis[Math.floor(Math.random() * 6)];
            }, 100);

            setTimeout(() => {
                clearInterval(rollInterval);
                
                const result = Math.floor(Math.random() * 6) + 1;
                dice.textContent = diceEmojis[result - 1];
                
                const isLow = result <= 3;
                const isHigh = result > 3;
                
                if ((choice === 'low' && isLow) || (choice === 'high' && isHigh)) {
                    addCoins(200);
                    userData.wins++;
                    showDiceResult('🎉 Выпало ' + result + '! +200 фишек!', 'win');
                } else {
                    userData.losses++;
                    showDiceResult('😢 Выпало ' + result + '. Не угадал!', 'lose');
                }
                
                saveUserData();
            }, 1500);
        }

        function showDiceResult(message, type) {
            const resultEl = document.getElementById('dice-message');
            resultEl.textContent = message;
            resultEl.className = 'result-message ' + type;
        }

        // ============ СБРОС ПРОФИЛЯ ============
        function resetProfile() {
            if (confirm('Точно сбросить весь прогресс?')) {
                localStorage.removeItem(getStorageKey());
                if (window.Telegram?.WebApp?.CloudStorage) {
                    window.Telegram.WebApp.CloudStorage.removeItem(getStorageKey());
                }
                
                userData.balance = 1000;
                userData.gamesPlayed = 0;
                userData.wins = 0;
                userData.losses = 0;
                userData.firstVisit = new Date().toISOString();
                userData.daysPlayed = 1;
                
                saveUserData();
                updateUI();
                showScreen('menu');
            }
        }

        // ============ ЗАПУСК ============
        initTelegram();
    </script>
</body>
</html>
```
